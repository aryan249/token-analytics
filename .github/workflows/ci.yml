name: CI/CD

on:
  push:
    branches: [main, staging, feat/*, fix/*]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: token-analytics
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-build-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src/ --max-warnings 0 || true

      - name: Type check
        run: |
          npx tsc --noEmit 2>&1 | grep -v "node_modules/" > /tmp/tsc-out.txt || true
          if grep -q "error TS" /tmp/tsc-out.txt; then
            cat /tmp/tsc-out.txt
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high || true

  docker-build-push:
    needs: lint-build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Login to ECR (with retry)
        run: |
          for i in 1 2 3; do
            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin 207270671706.dkr.ecr.$AWS_REGION.amazonaws.com && break
            echo "ECR login attempt $i failed, retrying in 15s..."
            sleep 15
          done

      - name: Build Docker image
        run: |
          REGISTRY=207270671706.dkr.ecr.$AWS_REGION.amazonaws.com
          IMAGE=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE .
          docker tag $IMAGE $REGISTRY/$ECR_REPOSITORY:latest
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Scan image for vulnerabilities
        run: |
          # Install Trivy if not present
          which trivy || (curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin)
          trivy image --exit-code 0 --severity HIGH,CRITICAL --no-progress $IMAGE
        continue-on-error: true

      - name: Push Docker image
        run: |
          docker push $IMAGE
          docker push $(echo $IMAGE | sed "s/:.*/:latest/")

      - name: Update Helm values with new image tag
        run: |
          REGISTRY=207270671706.dkr.ecr.$AWS_REGION.amazonaws.com
          sed -i "s|tag:.*|tag: \"$IMAGE_TAG\"|" helm/token-analytics/values.yaml
          sed -i "s|repository:.*|repository: $REGISTRY/$ECR_REPOSITORY|" helm/token-analytics/values.yaml

      - name: Commit and push image tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/token-analytics/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update image tag to ${IMAGE_TAG:0:8}"
          # Retry push with rebase to handle concurrent CI runs
          git push || (git pull --rebase && git push)

  deploy:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4.1.7
        with:
          ref: ${{ github.ref }}

      - name: Pull latest (includes image tag update from previous job)
        run: git pull --ff-only origin ${{ github.ref_name }} || true

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name token-analytics --region $AWS_REGION

      - name: Install External Secrets Operator (if not present)
        run: |
          helm repo add external-secrets https://charts.external-secrets.io || true
          helm repo update
          helm upgrade --install external-secrets external-secrets/external-secrets \
            --namespace external-secrets --create-namespace \
            --set installCRDs=true \
            --wait --timeout 5m

      - name: Install monitoring stack (umbrella chart)
        run: |
          cd helm/observability
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts 2>/dev/null || true
          helm repo add grafana https://grafana.github.io/helm-charts 2>/dev/null || true
          helm repo update
          helm dependency build
          cd ../..

          helm upgrade --install observability helm/observability \
            --namespace monitoring --create-namespace \
            --timeout 10m || echo "WARNING: Monitoring install timed out — will retry next deploy"

      - name: Deploy with Helm
        run: |
          helm upgrade --install token-analytics helm/token-analytics \
            --namespace token-analytics --create-namespace \
            --set image.tag="${IMAGE_TAG}" \
            --wait --timeout 10m

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n token-analytics
          echo ""
          echo "=== HPA ==="
          kubectl get hpa -n token-analytics
          echo ""
          echo "=== PDBs ==="
          kubectl get pdb -n token-analytics
          echo ""
          echo "=== Network Policies ==="
          kubectl get networkpolicy -n token-analytics
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n token-analytics
          echo ""
          echo "=== Monitoring Stack ==="
          kubectl get pods -n monitoring
          echo ""
          echo "=== Prometheus Targets ==="
          kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus

  # Note: When Argo CD is enabled, remove the deploy job above.
  # Argo CD will watch git and sync automatically.
