name: Build and Push Image

on:
  push:
    branches: [main, staging, feat/*, fix/*]
  pull_request:
    branches: [main, staging]

# ── All configurable values in one place ─────────────────────────────────────
env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "207270671706"
  ECR_REGISTRY: 207270671706.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: token-analytics
  EKS_CLUSTER: token-analytics
  NAMESPACE: token-analytics
  IMAGE_TAG: ${{ github.sha }}
  NODE_VERSION: "20"

jobs:
  lint-build-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-node@v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src/ --max-warnings 0 || true

      - name: Type check
        run: |
          npx tsc --noEmit --skipLibCheck 2>&1 | grep -v "node_modules/" > /tmp/tsc-out.txt || true
          if grep -q "error TS" /tmp/tsc-out.txt; then
            cat /tmp/tsc-out.txt
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high || true

  docker-build-push:
    needs: lint-build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          scanners: vuln

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --region $AWS_REGION \
            --query 'imageDetails[0].{Tag:imageTags[0],Pushed:imagePushedAt,Size:imageSizeInBytes}' \
            --output table

      - name: Deploy this exact image via Argo CD
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
        run: |
          # Only deploy from main/staging — feature branches just build + test
          APP_NAME="token-analytics-production"
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            APP_NAME="token-analytics-staging"
          fi

          aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION
          kubectl patch application $APP_NAME -n argocd --type merge -p "{
            \"spec\": {
              \"source\": {
                \"helm\": {
                  \"parameters\": [
                    {\"name\": \"image.tag\", \"value\": \"$IMAGE_TAG\", \"forceString\": true},
                    {\"name\": \"image.repository\", \"value\": \"$ECR_REGISTRY/$ECR_REPOSITORY\", \"forceString\": true}
                  ]
                }
              }
            }
          }"
          echo "Deployed $APP_NAME with image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  verify-deployment:
    needs: docker-build-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Wait for Image Updater (up to 5 min)
        run: |
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "Waiting for Argo CD Image Updater to detect: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          for i in $(seq 1 30); do
            CURRENT=$(kubectl get pods -n $NAMESPACE -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null || echo "unknown")
            echo "Attempt $i/30 — $CURRENT"
            echo "$CURRENT" | grep -q "$IMAGE_TAG" && echo "NEW IMAGE DEPLOYED" && break
            sleep 10
          done

      - name: Verify deployment
        run: ./scripts/verify-deployment.sh "$IMAGE_TAG"
