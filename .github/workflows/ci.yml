name: Build and Push Image

on:
  push:
    branches: [main, staging, feat/*, fix/*]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 207270671706.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: token-analytics
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-build-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src/ --max-warnings 0 || true

      - name: Type check
        run: |
          npx tsc --noEmit --skipLibCheck 2>&1 | grep -v "node_modules/" > /tmp/tsc-out.txt || true
          if grep -q "error TS" /tmp/tsc-out.txt; then
            cat /tmp/tsc-out.txt
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high || true

  docker-build-push:
    needs: lint-build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          scanners: vuln

      - name: Verify image in ECR
        run: |
          echo "=== Image pushed ==="
          aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$IMAGE_TAG \
            --region $AWS_REGION \
            --query 'imageDetails[0].{Tag:imageTags[0],Pushed:imagePushedAt,Size:imageSizeInBytes}' \
            --output table

  verify-deployment:
    needs: docker-build-push
    runs-on: self-hosted
    steps:
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name token-analytics --region $AWS_REGION

      - name: Wait for Argo CD to sync (up to 5 min)
        run: |
          echo "Waiting for Argo CD Image Updater to detect new tag..."
          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo ""

          for i in $(seq 1 30); do
            # Check if any pod is running the new image
            CURRENT=$(kubectl get pods -n token-analytics -o jsonpath='{.items[0].spec.containers[0].image}' 2>/dev/null || echo "unknown")
            echo "Attempt $i/30 — Current image: $CURRENT"

            if echo "$CURRENT" | grep -q "$IMAGE_TAG"; then
              echo ""
              echo "=== NEW IMAGE DEPLOYED ==="
              break
            fi
            sleep 10
          done

      - name: Verify cluster state
        run: |
          echo "=== Argo CD Applications ==="
          kubectl get applications -n argocd 2>/dev/null || echo "Argo CD not accessible"
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n token-analytics
          echo ""
          echo "=== Pod Images ==="
          kubectl get pods -n token-analytics -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.containers[0].image}{"\n"}{end}'
          echo ""
          echo "=== API Endpoint ==="
          kubectl get ingress -n token-analytics -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "No ingress"
          echo ""
          echo ""
          echo "=== Health Check ==="
          ENDPOINT=$(kubectl get ingress -n token-analytics -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
          if [ -n "$ENDPOINT" ]; then
            curl -s --max-time 5 "http://$ENDPOINT/health" || echo "Health check failed"
          fi
