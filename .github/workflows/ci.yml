name: Build and Push Image

on:
  push:
    branches: [main, staging, feat/*, fix/*]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 207270671706.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: token-analytics
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint-build-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src/ --max-warnings 0 || true

      - name: Type check
        run: |
          npx tsc --noEmit --skipLibCheck 2>&1 | grep -v "node_modules/" > /tmp/tsc-out.txt || true
          if grep -q "error TS" /tmp/tsc-out.txt; then
            cat /tmp/tsc-out.txt
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high || true

  docker-build-push:
    needs: lint-build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          scanners: vuln


