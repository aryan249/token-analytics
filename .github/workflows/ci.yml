name: Build and Push Image

on:
  push:
    branches: [main, staging, feat/*, fix/*]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "207270671706"
  ECR_REGISTRY: 207270671706.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: token-analytics
  EKS_CLUSTER: token-analytics
  NAMESPACE: token-analytics
  IMAGE_TAG: ${{ github.sha }}
  NODE_VERSION: "20"

jobs:
  lint-build-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - uses: actions/setup-node@v4.0.3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint src/ --max-warnings 0 || true

      - name: Type check
        run: |
          npx tsc --noEmit --skipLibCheck 2>&1 | grep -v "node_modules/" > /tmp/tsc-out.txt || true
          if grep -q "error TS" /tmp/tsc-out.txt; then
            cat /tmp/tsc-out.txt
            exit 1
          fi

      - name: Unit tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high || true

  docker-build-push:
    needs: lint-build-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/feat/') || startsWith(github.ref, 'refs/heads/fix/')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ECR_REGISTRY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          load: false
          platforms: linux/amd64
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:cache,mode=max

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: 0
          scanners: vuln

      - name: Print image tag for PR
        run: |
          echo "## Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To deploy, update \`helm/token-analytics/values.yaml\`:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "image:" >> $GITHUB_STEP_SUMMARY
          echo "  tag: \"$IMAGE_TAG\"" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Then merge to main (production) or staging." >> $GITHUB_STEP_SUMMARY

  # ── Deployment Flow ────────────────────────────────────────────────────────
  #
  # 1. Dev pushes to feature branch → CI builds + pushes image to ECR
  # 2. Dev creates PR to main/staging → includes values.yaml with new tag
  # 3. Reviewer verifies tag matches CI build
  # 4. PR merged → Argo CD detects git change → deploys that exact image
  #
  # Runner has ZERO write access to the cluster.
  # Only Argo CD (in-cluster) can deploy — and only from trusted git repo.
  #
  # To deploy:
  #   1. Copy image tag from CI output
  #   2. Update helm/token-analytics/values.yaml → image.tag
  #   3. Commit + push to your branch
  #   4. Create PR → merge to main
  #   5. Argo CD auto-syncs within 3 minutes

  verify-deployment:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4.1.7

      - name: Configure kubectl (read-only)
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Verify deployment
        run: ./scripts/verify-deployment.sh "$IMAGE_TAG"
