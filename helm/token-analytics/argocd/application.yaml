apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: token-analytics
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aryan249/token-analytics.git
    targetRevision: main
    path: helm/token-analytics
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: token-analytics
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
