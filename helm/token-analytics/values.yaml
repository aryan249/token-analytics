image:
  repository: 207270671706.dkr.ecr.ap-south-1.amazonaws.com/token-analytics
  tag: "2d4e958cd7d4707be0488be418b4217cf7c92242"
  pullPolicy: Always

namespace: token-analytics

# ── External Secrets (pulled from AWS Secrets Manager) ────────────────────────
externalSecrets:
  region: ap-south-1
  roleArn: "arn:aws:iam::207270671706:role/token-analytics-external-secrets-role"
  secretName: "token-analytics/app-secrets"
  # All keys from this secret are auto-extracted — no need to list them here.
  # Just add new keys to AWS Secrets Manager and pods will get them on next sync.

# ── Shared Config (injected into ALL pods via ConfigMap) ─────────────────────
# Add new env vars here — no template changes needed.
config:
  CHAIN_ID: "8453"
  BATCH_SIZE: "100"
  LOG_LEVEL: "info"
  NODE_ENV: "production"
  API_PORT: "3000"

# ── Indexer (StatefulSet, single instance) ────────────────────────────────────
indexer:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ── Processors (StatefulSets with consumer groups) ────────────────────────────
processors:
  trade:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 250m, memory: 256Mi }
  token:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 250m, memory: 256Mi }
  candle:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 250m, memory: 256Mi }
  position:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 250m, memory: 256Mi }
  fees:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits:   { cpu: 250m, memory: 256Mi }
  price:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { cpu: 100m, memory: 128Mi }

# ── API (Deployment, horizontally scalable) ───────────────────────────────────
api:
  replicas: 2
  port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCpuUtilization: 70
    targetMemoryUtilization: 80

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: alb
  host: ""
  # Set certificateArn to enable HTTPS (get free cert from ACM)
  certificateArn: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/stickiness-enabled: "true"
    alb.ingress.kubernetes.io/stickiness-type: "app_cookie"

# ── Pod Defaults (applied to all workloads) ─────────────────────────────────
# Change here → all pods updated. No template edits needed.
podDefaults:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurity:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  terminationGracePeriodSeconds: 60
  preStopSleepSeconds: 15

# ── Monitoring ──────────────────────────────────────────────────────────────
monitoring:
  enabled: true
