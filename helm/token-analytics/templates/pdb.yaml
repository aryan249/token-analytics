# API — always keep at least 1 pod available during disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
---
# Indexer — never evict the single indexer pod voluntarily
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: indexer-pdb
  namespace: {{ .Values.namespace }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: indexer
---
# PDBs for all processors — prevent simultaneous eviction during node drain
{{- range $name, $cfg := .Values.processors }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: processor-{{ $name }}-pdb
  namespace: {{ $.Values.namespace }}
spec:
  minAvailable: 0
  maxUnavailable: 1
  selector:
    matchLabels:
      app: processor-{{ $name }}
{{- end }}
