{{- range $name, $cfg := .Values.processors }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: processor-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: processor-{{ $name }}
    {{- include "token-analytics.labels" $ | nindent 4 }}
spec:
  serviceName: processor-{{ $name }}
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app: processor-{{ $name }}
  template:
    metadata:
      labels:
        app: processor-{{ $name }}
    spec:
      {{- include "token-analytics.securityContext" $ | nindent 6 }}
      {{- include "token-analytics.antiAffinity" (dict "app" (printf "processor-%s" $name)) | nindent 6 }}
      containers:
        - name: processor-{{ $name }}
          image: {{ include "token-analytics.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- include "token-analytics.containerSecurity" $ | nindent 10 }}
          command: ["node", "dist/processors/{{ $name }}.js"]
          envFrom:
            {{- include "token-analytics.envFrom" $ | nindent 12 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["node", "-e", "try{require('fs').statSync('/proc/1/status');process.exit(0)}catch{process.exit(1)}"]
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: processor-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: processor-{{ $name }}
spec:
  clusterIP: None
  selector:
    app: processor-{{ $name }}
{{- end }}
