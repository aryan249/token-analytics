{{- range $name, $cfg := .Values.processors }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: processor-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: processor-{{ $name }}
    {{- include "token-analytics.labels" $ | nindent 4 }}
spec:
  serviceName: processor-{{ $name }}
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      app: processor-{{ $name }}
  template:
    metadata:
      labels:
        app: processor-{{ $name }}
    spec:
      securityContext:
        {{- toYaml $.Values.podDefaults.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $.Values.podDefaults.terminationGracePeriodSeconds }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: processor-{{ $name }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: processor-{{ $name }}
          image: {{ include "token-analytics.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.podDefaults.containerSecurity | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ $.Values.podDefaults.preStopSleepSeconds }}"]
          command: ["node", "dist/processors/{{ $name }}.js"]
          envFrom:
            {{- include "token-analytics.envFrom" $ | nindent 12 }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["node", "-e", "setTimeout(()=>process.exit(0),0)"]
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["node", "-e", "try{require('fs').accessSync('/tmp/processor-ready');process.exit(0)}catch{process.exit(1)}"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["node", "-e", "try{const s=require('fs').statSync('/tmp/processor-alive');process.exit(Date.now()-s.mtimeMs<120000?0:1)}catch{process.exit(1)}"]
            initialDelaySeconds: 20
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: processor-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: processor-{{ $name }}
spec:
  clusterIP: None
  selector:
    app: processor-{{ $name }}
{{- end }}
