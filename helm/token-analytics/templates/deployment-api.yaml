apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Values.namespace }}
  labels:
    app: api
    {{- include "token-analytics.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      {{- include "token-analytics.securityContext" . | nindent 6 }}
      {{- include "token-analytics.antiAffinity" (dict "app" "api") | nindent 6 }}
      containers:
        - name: api
          image: {{ include "token-analytics.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "token-analytics.containerSecurity" . | nindent 10 }}
          command: ["node", "dist/api/server.js"]
          ports:
            - containerPort: {{ .Values.api.port }}
              protocol: TCP
          envFrom:
            {{- include "token-analytics.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            failureThreshold: 10
            periodSeconds: 5
      {{- include "token-analytics.tmpVolume" . | nindent 6 }}
      restartPolicy: Always
