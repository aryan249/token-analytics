apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: {{ .Values.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.externalSecrets.roleArn | quote }}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ .Values.namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}-secrets
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: {{ .Chart.Name }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secretName }}
        property: POSTGRES_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secretName }}
        property: REDIS_URL
    - secretKey: ALCHEMY_WS_URL
      remoteRef:
        key: {{ .Values.externalSecrets.secretName }}
        property: ALCHEMY_WS_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.secretName }}
        property: JWT_SECRET
