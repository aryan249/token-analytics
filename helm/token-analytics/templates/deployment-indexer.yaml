apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: indexer
  namespace: {{ .Values.namespace }}
  labels:
    app: indexer
    {{- include "token-analytics.labels" . | nindent 4 }}
spec:
  serviceName: indexer
  replicas: {{ .Values.indexer.replicas }}
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      securityContext:
        {{- toYaml .Values.podDefaults.securityContext | nindent 8 }}
      terminationGracePeriodSeconds: 90
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: indexer
                topologyKey: kubernetes.io/hostname
      containers:
        - name: indexer
          image: {{ include "token-analytics.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.podDefaults.containerSecurity | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.podDefaults.preStopSleepSeconds }}"]
          command: ["node", "dist/indexer/main.js"]
          envFrom:
            {{- include "token-analytics.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.indexer.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["node", "-e", "setTimeout(()=>process.exit(0),0)"]
            failureThreshold: 12
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["node", "-e", "try{require('fs').accessSync('/tmp/indexer-ready');process.exit(0)}catch{process.exit(1)}"]
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["node", "-e", "try{const s=require('fs').statSync('/tmp/indexer-alive');process.exit(Date.now()-s.mtimeMs<120000?0:1)}catch{process.exit(1)}"]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always
