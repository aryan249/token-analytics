apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: indexer
  namespace: {{ .Values.namespace }}
  labels:
    app: indexer
    {{- include "token-analytics.labels" . | nindent 4 }}
spec:
  serviceName: indexer
  replicas: {{ .Values.indexer.replicas }}
  selector:
    matchLabels:
      app: indexer
  template:
    metadata:
      labels:
        app: indexer
    spec:
      {{- include "token-analytics.securityContext" . | nindent 6 }}
      containers:
        - name: indexer
          image: {{ include "token-analytics.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "token-analytics.containerSecurity" . | nindent 10 }}
          command: ["node", "dist/indexer/main.js"]
          envFrom:
            {{- include "token-analytics.envFrom" . | nindent 12 }}
          resources:
            {{- toYaml .Values.indexer.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["node", "-e", "try{require('fs').statSync('/proc/1/status');process.exit(0)}catch{process.exit(1)}"]
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
      {{- include "token-analytics.tmpVolume" . | nindent 6 }}
      restartPolicy: Always
