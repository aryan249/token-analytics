{{- if .Values.api.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: {{ .Values.namespace }}
  labels:
    app: api
    {{- include "token-analytics.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCpuUtilization }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetMemoryUtilization }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: {{ .Values.api.hpa.scaleUp.stabilizationSeconds }}
      policies:
        - type: Pods
          value: {{ .Values.api.hpa.scaleUp.pods }}
          periodSeconds: {{ .Values.api.hpa.scaleUp.periodSeconds }}
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.api.hpa.scaleDown.stabilizationSeconds }}
      policies:
        - type: Pods
          value: {{ .Values.api.hpa.scaleDown.pods }}
          periodSeconds: {{ .Values.api.hpa.scaleDown.periodSeconds }}
{{- end }}
