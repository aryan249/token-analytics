# Loki (log aggregation) — sized for t3.small nodes
# Install: helm upgrade --install loki grafana/loki-stack \
#            -n monitoring --create-namespace -f helm/observability/loki-values.yaml

loki:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  config:
    # Short retention for free tier
    table_manager:
      retention_deletes_enabled: true
      retention_period: 72h  # 3 days
    limits_config:
      ingestion_rate_mb: 4
      ingestion_burst_size_mb: 6
      max_streams_per_user: 10000
  persistence:
    enabled: false  # emptyDir for free tier (logs lost on pod restart, but 3-day retention anyway)

# Promtail — collects logs from all pods and ships to Loki
promtail:
  enabled: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  config:
    clients:
      - url: http://loki:3100/loki/api/v1/push
    snippets:
      # Parse Pino JSON logs from token-analytics pods
      pipelineStages:
        - docker: {}
        - json:
            expressions:
              level: level
              msg: msg
              stream: stream
              err: err
        - labels:
            level:
            stream:

# Grafana is deployed via kube-prometheus-stack, not here
grafana:
  enabled: false
