# Loki (single-binary mode) — lightweight log aggregation
# Install: helm upgrade --install loki grafana/loki \
#            -n monitoring --create-namespace -f helm/observability/loki-values.yaml

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  limits_config:
    retention_period: 72h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: false

# Disable components not needed in single-binary mode
gateway:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
