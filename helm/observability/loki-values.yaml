# Loki (single-binary mode) — lightweight log aggregation
# Install: helm upgrade --install loki grafana/loki \
#            -n monitoring --create-namespace -f helm/observability/loki-values.yaml

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  storage:
    type: filesystem
  limits_config:
    retention_period: 72h
    max_query_series: 500
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 6
  compactor:
    retention_enabled: true
    working_directory: /var/loki/compactor
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    enabled: false

# Disable components not needed in single-binary mode
gateway:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
